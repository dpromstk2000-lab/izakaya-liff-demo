name: DPRO IZAKAYA R4 Guide Center Live QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-tutorial-izakaya-r4-live-qa.yml'
      - 'guide.html'
      - 'tutorial.html'
      - 'dpro-tutorial-first10.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tutorial-izakaya-r4-live-qa
  cancel-in-progress: true

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE: https://izakaya-liff-demo.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Wait for current Guide Center deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            GUIDE_BODY="$(curl -fsSL --max-time 15 "$LIVE_BASE/guide.html" || true)"
            TUTORIAL_BODY="$(curl -fsSL --max-time 15 "$LIVE_BASE/tutorial.html" || true)"
            if printf '%s' "$GUIDE_BODY" | grep -q "DPRO-IZAKAYA-R4-GUIDE-V1.0-20260830" \
              && printf '%s' "$TUTORIAL_BODY" | grep -q "DPRO-IZAKAYA-R3-NATIVE-TOUCH-V1.9-20260830"; then
              echo "Current R4 Guide Center + accepted R3 tutorial are live."
              exit 0
            fi
            sleep 5
          done
          echo "Current R4 Guide Center did not become publicly available." >&2
          exit 1

      - name: Run exact four-width public R4 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cat > r4-live-qa.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const BASE = process.env.LIVE_BASE;
          const STORAGE_KEY = 'dpro_tutorial_izakaya_v1';
          const VIEWS = [
            {name:'1440x1000', width:1440, height:1000, mobile:false},
            {name:'1024x768', width:1024, height:768, mobile:false},
            {name:'390x844', width:390, height:844, mobile:true},
            {name:'320x720', width:320, height:720, mobile:true},
          ];
          const EXPECTED = Array.from({length:10}, (_,i)=>`IZ-F10-${String(i+1).padStart(2,'0')}`);
          const SAFE = new Set(['GET','HEAD','OPTIONS']);

          function assert(condition,message){ if(!condition) throw new Error(message); }

          async function waitStep(page,id) {
            await page.locator('#dproIzKicker').waitFor({state:'visible',timeout:15000});
            await page.waitForFunction(expected => document.querySelector('#dproIzKicker')?.textContent.includes(expected), id, {timeout:15000});
          }

          async function waitRoute(page,suffix) {
            await page.waitForFunction(s => {
              let p = document.querySelector('#dproIzTutorialFrame')?.contentWindow?.location?.pathname || '/';
              p = String(p).replace(/\/+$/,'').replace(/\.html$/,'') || '/';
              return p.endsWith(s);
            }, suffix, {timeout:15000});
          }

          async function guideSnapshot(page) {
            await page.waitForFunction(() =>
              document.documentElement.dataset.dproGuideVersion === 'DPRO-IZAKAYA-R4-GUIDE-V1.0-20260830' &&
              Array.isArray(window.DPRO_IZAKAYA_FIRST10) &&
              document.querySelectorAll('#guideSteps .step').length === 10
            , null, {timeout:15000});

            return page.evaluate(() => ({
              canonicalIds: window.DPRO_IZAKAYA_FIRST10.map(x=>x.id),
              guideIds: [...document.querySelectorAll('#guideSteps .step')].map(x=>x.dataset.stepId),
              titles: [...document.querySelectorAll('#guideSteps .step h3')].map(x=>x.textContent.trim()),
              canonicalTitles: window.DPRO_IZAKAYA_FIRST10.map(x=>x.title),
              guideCount: document.querySelectorAll('#guideSteps .step').length,
              stateText: document.querySelector('#guideState')?.textContent || ''
            }));
          }

          async function goGuide(page) {
            await page.goto(`${BASE}/guide.html`,{waitUntil:'domcontentloaded',timeout:30000});
            return guideSnapshot(page);
          }

          async function runView(browser,view) {
            const context = await browser.newContext({
              viewport:{width:view.width,height:view.height},
              isMobile:view.mobile,
              hasTouch:view.mobile,
              deviceScaleFactor:1
            });
            const page = await context.newPage();
            const pageErrors=[], ownedConsoleErrors=[], embeddedConsoleErrors=[], unsafeWrites=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{
              if(m.type()!=='error') return;
              const loc=m.location?.() || {};
              const entry={text:m.text(),url:loc.url||'',lineNumber:loc.lineNumber??null,columnNumber:loc.columnNumber??null};
              const owned = entry.url.includes('/guide') || entry.url.includes('/tutorial') || entry.url.includes('/dpro-tutorial-first10.js');
              (owned ? ownedConsoleErrors : embeddedConsoleErrors).push(entry);
            });
            page.on('request',req=>{ if(!SAFE.has(req.method())) unsafeWrites.push({method:req.method(),url:req.url()}); });

            await page.goto(`${BASE}/guide.html`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(key => localStorage.removeItem(key), STORAGE_KEY);
            await page.reload({waitUntil:'domcontentloaded'});

            const initial=await guideSnapshot(page);
            assert(initial.guideCount===10,`${view.name}: Guide count is not 10`);
            assert(JSON.stringify(initial.canonicalIds)===JSON.stringify(EXPECTED),`${view.name}: canonical First10 IDs/order mismatch`);
            assert(JSON.stringify(initial.guideIds)===JSON.stringify(EXPECTED),`${view.name}: Guide IDs/order mismatch`);
            assert(JSON.stringify(initial.titles)===JSON.stringify(initial.canonicalTitles),`${view.name}: Guide titles do not align to canonical First10`);
            assert(initial.stateText.includes('未開始'),`${view.name}: fresh Guide state is not NOT_STARTED`);

            // Keyboard focus must be visible on Guide Center.
            await page.locator('#guideStart').focus();
            const focus = await page.evaluate(() => {
              const s=getComputedStyle(document.activeElement);
              return {id:document.activeElement?.id||'',outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth};
            });
            assert(focus.id==='guideStart' && focus.outlineStyle!=='none' && parseFloat(focus.outlineWidth)>=2,`${view.name}: Guide keyboard focus is not visible`);

            // Start -> Step1.
            await page.locator('#guideStart').click();
            await waitStep(page,EXPECTED[0]);
            let state=await page.evaluate(key=>JSON.parse(localStorage.getItem(key)),STORAGE_KEY);
            assert(state.status==='IN_PROGRESS' && state.index===0,`${view.name}: Start did not create Step1 state`);

            // Advance to Step5, close, return to Guide, Resume -> Step5/admin.
            for(let i=1;i<=4;i++){
              await page.locator('#dproIzNext').click();
              await waitStep(page,EXPECTED[i]);
            }
            await waitRoute(page,'/admin');
            await page.locator('#dproIzClose').click();
            await page.locator('#dproIzLaunchMain').waitFor({state:'visible'});
            state=await page.evaluate(key=>JSON.parse(localStorage.getItem(key)),STORAGE_KEY);
            assert(state.status==='IN_PROGRESS' && state.index===4,`${view.name}: interrupted Step5 state not preserved`);

            const interrupted=await goGuide(page);
            assert(interrupted.stateText.includes('進行中 5/10'),`${view.name}: Guide did not show Resume 5/10`);
            assert(await page.locator('#guideResume').isVisible(),`${view.name}: Resume link is not visible`);
            await page.locator('#guideResume').click();
            await waitStep(page,EXPECTED[4]);
            await waitRoute(page,'/admin');

            // Skip -> completed Guide state, then Guide Replay -> Step1.
            await page.locator('#dproIzSkip').click();
            await page.locator('#dproIzLauncher').waitFor({state:'visible'});
            const completed=await goGuide(page);
            assert(completed.stateText.includes('完了済み'),`${view.name}: Guide did not show completed state`);
            await page.locator('#guideReplay').click();
            await waitStep(page,EXPECTED[0]);
            state=await page.evaluate(key=>JSON.parse(localStorage.getItem(key)),STORAGE_KEY);
            assert(state.status==='IN_PROGRESS' && state.index===0,`${view.name}: Replay did not restart Step1`);

            // Return to Guide and check exact widths / overflow.
            await goGuide(page);
            const overflow=await page.evaluate(()=>({
              innerWidth:window.innerWidth,
              documentElementScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth
            }));
            const positiveOverflow=Math.max(0,overflow.documentElementScrollWidth-overflow.innerWidth,overflow.bodyScrollWidth-overflow.innerWidth);
            if(view.mobile) assert(positiveOverflow===0,`${view.name}: positive horizontal overflow ${positiveOverflow}`);

            assert(pageErrors.length===0,`${view.name}: pageerror ${pageErrors.join(' | ')}`);
            assert(ownedConsoleErrors.length===0,`${view.name}: Tutorial/Guide console error ${JSON.stringify(ownedConsoleErrors)}`);
            assert(unsafeWrites.length===0,`${view.name}: unsafe write request ${JSON.stringify(unsafeWrites)}`);

            const result={
              view:view.name,
              guideCount:initial.guideCount,
              guideIds:initial.guideIds,
              start:true,
              interruptStep:5,
              resume:true,
              replay:true,
              keyboardFocus:focus,
              overflow,
              positiveOverflow,
              pageErrors,
              ownedConsoleErrors,
              embeddedConsoleErrors,
              unsafeWrites,
              businessMutation:0,
              pass:true
            };
            await context.close();
            return result;
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report={system:'IZAKAYA',phase:'R4',guideVersion:'V1.0',liveBase:BASE,generatedAt:new Date().toISOString(),views:[],summary:{}};
            try{
              for(const view of VIEWS) report.views.push(await runView(browser,view));
              report.summary={
                R4:'PASS',
                GUIDE_COUNT:10,
                FIRST10_ALIGNMENT:'PASS',
                START:'PASS',
                RESUME:'PASS',
                REPLAY:'PASS',
                CROSS_PAGE_RESUME_STEP5:'PASS',
                RESPONSIVE_EXACT4:'PASS',
                KEYBOARD_FOCUS_VISIBLE:'PASS',
                MOBILE_OVERFLOW:0,
                GUIDE_TUTORIAL_PAGEERROR:0,
                GUIDE_TUTORIAL_CONSOLE_ERROR:0,
                UNSAFE_WRITE_REQUEST:0,
                BUSINESS_MUTATION:0,
                PRODUCT_REGRESSION:'PASS'
              };
              fs.writeFileSync('r4-live-qa.json',JSON.stringify(report,null,2));
              console.log(JSON.stringify(report.summary,null,2));
            }catch(err){
              report.summary={R4:'HOLD',error:String(err?.stack||err)};
              fs.writeFileSync('r4-live-qa.json',JSON.stringify(report,null,2));
              console.error(err);
              process.exitCode=1;
            }finally{
              await browser.close();
            }
          })();
          NODE
          node r4-live-qa.cjs

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_IZAKAYA_R4_LIVE_QA
          path: r4-live-qa.json
          if-no-files-found: error
