name: DPRO IZAKAYA R3 Live QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-tutorial-izakaya-r3-live-qa.yml'
      - 'dpro-tutorial-first10.js'
      - 'tutorial.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tutorial-izakaya-r3-live-qa
  cancel-in-progress: true

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE: https://izakaya-liff-demo.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Wait for current tutorial deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            BODY="$(curl -fsSL --max-time 15 "$LIVE_BASE/dpro-tutorial-first10.js" || true)"
            if printf '%s' "$BODY" | grep -q "IZAKAYA-FIRST10-R3-V1.1-20260830"; then
              echo "Current R3 tutorial is live."
              exit 0
            fi
            sleep 5
          done
          echo "R3 tutorial did not become publicly available." >&2
          exit 1

      - name: Run exact four-width public LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cat > r3-live-qa.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const BASE = process.env.LIVE_BASE;
          const VIEWS = [
            {name:'1440x1000', width:1440, height:1000, mobile:false},
            {name:'1024x768', width:1024, height:768, mobile:false},
            {name:'390x844', width:390, height:844, mobile:true},
            {name:'320x720', width:320, height:720, mobile:true},
          ];
          const EXPECTED = Array.from({length:10}, (_,i)=>`IZ-F10-${String(i+1).padStart(2,'0')}`);
          const SAFE = new Set(['GET','HEAD','OPTIONS']);

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }
          async function waitStep(page, id) {
            await page.locator('#dproIzKicker').waitFor({state:'visible', timeout:15000});
            await page.waitForFunction(expected => document.querySelector('#dproIzKicker')?.textContent.includes(expected), id, {timeout:15000});
          }
          async function childFrame(page) {
            await page.waitForFunction(() => document.querySelector('#dproIzTutorialFrame')?.contentWindow?.location?.href && !document.querySelector('#dproIzTutorialFrame').contentWindow.location.href.startsWith('about:'), null, {timeout:15000});
            const handle = await page.locator('#dproIzTutorialFrame').elementHandle();
            const frame = await handle.contentFrame();
            assert(frame, 'Tutorial child frame missing');
            return frame;
          }
          async function resolveStep(page, index) {
            const id = EXPECTED[index];
            await waitStep(page, id);
            const data = await page.evaluate(i => window.DPRO_IZAKAYA_FIRST10[i], index);
            assert(data && data.id === id, `${id}: canonical step mismatch`);
            const frame = await childFrame(page);
            const expectedPath = new URL(data.route, BASE + '/tutorial.html').pathname;
            await page.waitForFunction(path => {
              const actual = document.querySelector('#dproIzTutorialFrame')?.contentWindow?.location?.pathname || '';
              return actual === path || (path.endsWith('/index.html') && (actual === '/' || actual.endsWith('/')));
            }, expectedPath, {timeout:15000});
            let selected = null;
            const deadline = Date.now() + 8000;
            while (!selected && Date.now() < deadline) {
              for (const selector of data.selectors) {
                try {
                  if (await frame.locator(selector).first().isVisible()) { selected = selector; break; }
                } catch {}
              }
              if (!selected) await page.waitForTimeout(150);
            }
            assert(selected, `${id}: no primary/fallback selector resolved`);
            await page.waitForFunction(() => getComputedStyle(document.querySelector('#dproIzTutorialHighlight')).display !== 'none', null, {timeout:5000});
            return {id, route:new URL(frame.url()).pathname + new URL(frame.url()).search, selector:selected};
          }
          async function cardBox(page) {
            const b = await page.locator('#dproIzTutorialCard').boundingBox();
            assert(b, 'Tutorial card bounding box missing');
            return b;
          }
          function insideViewport(box, width, height) {
            const eps=1.5;
            return box.x >= 4-eps && box.y >= 4-eps && box.x + box.width <= width-4+eps && box.y + box.height <= height-4+eps;
          }
          async function mouseDrag(page, width, height) {
            const h = await page.locator('#dproIzDragHandle').boundingBox();
            const before = await cardBox(page);
            assert(h, 'Mouse drag handle missing');
            await page.mouse.move(h.x+h.width/2,h.y+h.height/2);
            await page.mouse.down();
            await page.mouse.move(2,2,{steps:8});
            await page.mouse.up();
            const after = await cardBox(page);
            assert(Math.abs(after.x-before.x)>10 || Math.abs(after.y-before.y)>10, 'Mouse/pointer drag did not move card');
            assert(insideViewport(after,width,height), 'Mouse drag viewport clamp failed');
            return {before,after};
          }
          async function touchPointerDrag(context, page, width, height) {
            const h = await page.locator('#dproIzDragHandle').boundingBox();
            const before = await cardBox(page);
            assert(h, 'Touch drag handle missing');
            const cdp = await context.newCDPSession(page);
            const sx=h.x+h.width/2, sy=h.y+h.height/2;
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:sx,y:sy,radiusX:1,radiusY:1,force:1,id:1}]});
            for(let i=1;i<=8;i++){
              const x=sx+(width-2-sx)*i/8, y=sy+(height-2-sy)*i/8;
              await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y,radiusX:1,radiusY:1,force:1,id:1}]});
            }
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await page.waitForTimeout(120);
            const after = await cardBox(page);
            assert(Math.abs(after.x-before.x)>10 || Math.abs(after.y-before.y)>10, 'Touch/pointer drag did not move card');
            assert(insideViewport(after,width,height), 'Touch drag viewport clamp failed');
            return {before,after};
          }
          async function functionalQA(page, view) {
            const resolved=[];
            resolved.push(await resolveStep(page,0));
            await page.locator('#dproIzNext').click();
            resolved.push(await resolveStep(page,1));
            await page.locator('#dproIzPrev').click();
            await waitStep(page,EXPECTED[0]);
            await page.locator('#dproIzNext').click();
            await waitStep(page,EXPECTED[1]);
            for(let i=2;i<10;i++){
              await page.locator('#dproIzNext').click();
              resolved.push(await resolveStep(page,i));
            }
            assert(resolved.length===10,'Step resolution count is not 10');

            // Cross-page Resume at admin route (Step5).
            await page.evaluate(() => window.DPRO_IZAKAYA_TUTORIAL.replay());
            await waitStep(page,EXPECTED[0]);
            for(let i=1;i<=4;i++){ await page.locator('#dproIzNext').click(); await waitStep(page,EXPECTED[i]); }
            let frame = await childFrame(page);
            assert(new URL(frame.url()).pathname.endsWith('/admin.html'),'Step5 is not on admin.html');
            await page.locator('#dproIzClose').click();
            await page.locator('#dproIzLaunchMain').waitFor({state:'visible'});
            const closedState = await page.evaluate(() => JSON.parse(localStorage.getItem('dpro_tutorial_izakaya_v1')));
            assert(closedState.status==='IN_PROGRESS' && closedState.index===4,'Close did not preserve Step5');
            await page.locator('#dproIzLaunchMain').click();
            await waitStep(page,EXPECTED[4]);
            frame=await childFrame(page);
            assert(new URL(frame.url()).pathname.endsWith('/admin.html'),'Resume did not restore admin route');

            // Esc close.
            await page.keyboard.press('Escape');
            await page.locator('#dproIzLaunchMain').waitFor({state:'visible'});
            const recoveredFocus=await page.evaluate(() => document.activeElement?.id || '');
            assert(recoveredFocus==='dproIzLaunchMain','Focus did not recover to Resume launcher after Esc');

            // Replay -> Step1.
            await page.locator('#dproIzReplay').click();
            await waitStep(page,EXPECTED[0]);

            // Keyboard-only progression through all 10.
            const handle = page.locator('#dproIzDragHandle');
            await handle.focus();
            await page.keyboard.press('Tab');
            const focusStyle = await page.evaluate(() => { const el=document.activeElement; const s=getComputedStyle(el); return {id:el?.id||'',outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth}; });
            assert(focusStyle.outlineStyle !== 'none' && parseFloat(focusStyle.outlineWidth) >= 2, 'Visible keyboard focus missing');
            const next=page.locator('#dproIzNext');
            await next.focus();
            for(let i=1;i<10;i++){
              await page.keyboard.press('Enter');
              await waitStep(page,EXPECTED[i]);
            }
            await page.keyboard.press('Enter');
            await page.locator('#dproIzLauncher').waitFor({state:'visible'});
            const completed=await page.evaluate(() => JSON.parse(localStorage.getItem('dpro_tutorial_izakaya_v1')));
            assert(completed.status==='COMPLETED','Keyboard-only completion failed');

            // Replay and Skip.
            await page.locator('#dproIzReplay').click();
            await waitStep(page,EXPECTED[0]);
            await page.locator('#dproIzSkip').click();
            await page.locator('#dproIzLauncher').waitFor({state:'visible'});
            const skipped=await page.evaluate(() => JSON.parse(localStorage.getItem('dpro_tutorial_izakaya_v1')));
            assert(skipped.status==='COMPLETED','Skip did not complete state');

            return {resolved, focusStyle, closeResumeStep:5, esc:true, replay:true, skip:true, nextBack:true, keyboardOnly:true};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report={system:'IZAKAYA',phase:'R3',standard:'V1.1',liveBase:BASE,generatedAt:new Date().toISOString(),views:[],summary:{}};
            let globalMouse=false,globalTouch=false;
            try{
              for(const view of VIEWS){
                const context=await browser.newContext({viewport:{width:view.width,height:view.height},isMobile:view.mobile,hasTouch:view.mobile,deviceScaleFactor:1});
                const page=await context.newPage();
                const pageErrors=[],consoleErrors=[],unsafeWrites=[];
                page.on('pageerror',e=>pageErrors.push(String(e)));
                page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
                page.on('request',req=>{ if(!SAFE.has(req.method())) unsafeWrites.push({method:req.method(),url:req.url()}); });
                await page.goto(`${BASE}/tutorial.html?replay=1`,{waitUntil:'domcontentloaded',timeout:30000});
                await page.locator('#dproIzTutorialCard').waitFor({state:'visible',timeout:20000});
                const canonical=await page.evaluate(() => ({count:window.DPRO_IZAKAYA_FIRST10.length,ids:window.DPRO_IZAKAYA_FIRST10.map(x=>x.id),unique:new Set(window.DPRO_IZAKAYA_FIRST10.map(x=>x.id)).size}));
                assert(canonical.count===10 && canonical.unique===10,`${view.name}: First10 exactly-10 failed`);
                assert(JSON.stringify(canonical.ids)===JSON.stringify(EXPECTED),`${view.name}: First10 IDs/order mismatch`);

                let dragResult=null;
                if(view.name==='1440x1000'){ dragResult=await mouseDrag(page,view.width,view.height); globalMouse=true; }
                if(view.name==='390x844'){ dragResult=await touchPointerDrag(context,page,view.width,view.height); globalTouch=true; }
                const functional=await functionalQA(page,view);
                const overflow=await page.evaluate(() => ({innerWidth:window.innerWidth,documentElementScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth}));
                const positiveOverflow=Math.max(0,overflow.documentElementScrollWidth-overflow.innerWidth,overflow.bodyScrollWidth-overflow.innerWidth);
                if(view.mobile) assert(positiveOverflow===0,`${view.name}: positive horizontal overflow ${positiveOverflow}`);
                assert(pageErrors.length===0,`${view.name}: pageerror ${pageErrors.join(' | ')}`);
                assert(consoleErrors.length===0,`${view.name}: console error ${consoleErrors.join(' | ')}`);
                assert(unsafeWrites.length===0,`${view.name}: unsafe write request ${JSON.stringify(unsafeWrites)}`);
                report.views.push({view:view.name,canonical,dragResult,functional,overflow,positiveOverflow,pageErrors,consoleErrors,unsafeWrites,pass:true});
                await context.close();
              }
              assert(globalMouse,'Mouse/pointer drag not tested');
              assert(globalTouch,'Touch/pointer drag not tested');
              report.summary={R3:'PASS',FIRST10_COUNT:10,MOUSE_POINTER_DRAG:'PASS',TOUCH_POINTER_DRAG:'PASS',VIEWPORT_CLAMP:'PASS',NEXT_BACK:'PASS',CLOSE:'PASS',ESC:'PASS',SKIP:'PASS',RESUME:'PASS',REPLAY:'PASS',KEYBOARD_ONLY:'PASS',FOCUS_VISIBLE_RECOVERABLE:'PASS',CROSS_PAGE_RESUME:'PASS',TUTORIAL_PAGEERROR:0,TUTORIAL_CONSOLE_ERROR:0,UNSAFE_WRITE_REQUEST:0,BUSINESS_MUTATION:0};
              fs.writeFileSync('r3-live-qa.json',JSON.stringify(report,null,2));
              console.log(JSON.stringify(report.summary,null,2));
            }catch(err){
              report.summary={R3:'HOLD',error:String(err?.stack||err)};
              fs.writeFileSync('r3-live-qa.json',JSON.stringify(report,null,2));
              console.error(err);
              process.exitCode=1;
            }finally{ await browser.close(); }
          })();
          NODE
          node r3-live-qa.cjs

      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_IZAKAYA_R3_LIVE_QA
          path: r3-live-qa.json
          if-no-files-found: error
