name: DPRO IZAKAYA R6 Product Site Live QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-tutorial-izakaya-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tutorial-izakaya-r6-product-site-live-qa
  cancel-in-progress: true

jobs:
  r6-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/izakaya.html
      TUTORIAL_URL: https://izakaya-liff-demo.pages.dev/tutorial.html
      GUIDE_URL: https://izakaya-liff-demo.pages.dev/guide.html
      QUICK_PDF_URL: https://izakaya-liff-demo.pages.dev/DPRO_TUTORIAL_IZAKAYA_QUICK_START_V1.0.pdf
      DETAIL_PDF_URL: https://izakaya-liff-demo.pages.dev/DPRO_TUTORIAL_IZAKAYA_DETAILED_MANUAL_V1.0.pdf
      QUICK_PDF_SHA256: 207c5426c05a4f068abab55d41a64a3f8c1a01dc3c6bfcce5589dff36b73240a
      DETAIL_PDF_SHA256: 915a63b5b1d58caf6b06c99d0ee8da792bee455ee78670d1e0596b005d887a9a
      EXPECTED_PRODUCT_COMMIT: 2e955a00f55b2591525e6c23767663bf21025bb2
      EXPECTED_PRODUCT_BLOB: 0604a2ea6fb510baade943029be24271763671a0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run exact 4-view public R6 QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r6-qa/screenshots
          cat > r6-qa/r6-live-qa.mjs <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium, request } from 'playwright';

          const env = process.env;
          const PRODUCT = env.PRODUCT_URL;
          const resources = [
            {key:'tutorial-start', url:env.TUTORIAL_URL, label:'Tutorial Start', type:'html'},
            {key:'guide-center', url:env.GUIDE_URL, label:'Guide Center', type:'html'},
            {key:'quick-start-pdf', url:env.QUICK_PDF_URL, label:'Quick Start PDF', type:'pdf', sha:env.QUICK_PDF_SHA256},
            {key:'detailed-manual-pdf', url:env.DETAIL_PDF_URL, label:'Detailed Manual PDF', type:'pdf', sha:env.DETAIL_PDF_SHA256},
          ];
          const viewports = [
            {name:'1440x1000', width:1440, height:1000},
            {name:'1024x768', width:1024, height:768},
            {name:'390x844', width:390, height:844},
            {name:'320x720', width:320, height:720},
          ];
          const writeMethods = new Set(['POST','PUT','PATCH','DELETE']);
          const sha256 = b => crypto.createHash('sha256').update(b).digest('hex');
          const assert = (ok,msg) => { if(!ok) throw new Error(msg); };
          const sleep = ms => new Promise(r => setTimeout(r,ms));

          const report = {
            system:'IZAKAYA',
            phase:'R6',
            standard:'DPRO TUTORIAL STANDARD V1.1',
            productUrl:PRODUCT,
            expectedProductCommit:env.EXPECTED_PRODUCT_COMMIT,
            expectedProductBlob:env.EXPECTED_PRODUCT_BLOB,
            resources:[],
            viewports:[],
            totals:{pageErrors:0, consoleErrors:0, unsafeWrites:0, businessMutation:0},
            gates:{}
          };

          // Verify Product Site main still contains the expected IZAKAYA blob.
          const api = await request.newContext({
            extraHTTPHeaders: {'Accept':'application/vnd.github+json','User-Agent':'DPRO-IZAKAYA-R6-QA'}
          });
          const gh = await api.get('https://api.github.com/repos/dpromstk2000-lab/dpro-line-systems-site/contents/systems/izakaya.html?ref=main');
          assert(gh.ok(),`GitHub product blob lookup HTTP ${gh.status()}`);
          const ghJson = await gh.json();
          assert(ghJson.sha === env.EXPECTED_PRODUCT_BLOB,`IZAKAYA main blob changed: ${ghJson.sha}`);
          report.productMainBlob = ghJson.sha;
          report.gates.PRODUCT_SITE_TARGET_BLOB_LOCK = 'PASS';

          // Wait for public Pages to expose all four R6 resource markers.
          let published = null;
          for(let i=0;i<30;i++){
            const r = await api.get(`${PRODUCT}?r6qa=${Date.now()}-${i}`);
            const text = await r.text();
            if(r.ok() &&
              text.includes('id="tutorial-resources"') &&
              resources.every(x => text.includes(`data-izakaya-tutorial-resource="${x.key}"`) && text.includes(x.url))) {
              published = {status:r.status(), attempt:i+1};
              break;
            }
            await sleep(5000);
          }
          assert(published,'R6 Product Site markers not public');
          report.published = published;
          report.gates.PRODUCT_SITE_PUBLISHED = 'PASS';

          // Verify the four destinations independently.
          for (const x of resources) {
            const r = await api.get(`${x.url}${x.url.includes('?')?'&':'?'}r6qa=${Date.now()}`);
            const body = Buffer.from(await r.body());
            assert(r.ok(),`${x.key} HTTP ${r.status()}`);
            const item = {key:x.key, url:x.url, status:r.status(), contentType:r.headers()['content-type']||''};
            if(x.type === 'pdf'){
              assert(body.subarray(0,5).toString() === '%PDF-',`${x.key} not PDF`);
              item.sha256 = sha256(body);
              assert(item.sha256 === x.sha,`${x.key} SHA mismatch ${item.sha256}`);
            } else {
              const text = body.toString('utf8');
              if(x.key === 'tutorial-start'){
                assert(text.includes('DPRO-IZAKAYA-R3-NATIVE-TOUCH-V1.9-20260830'),'Tutorial marker missing');
              }
              if(x.key === 'guide-center'){
                assert(text.includes('DPRO-IZAKAYA-R4-GUIDE-V1.0-20260830'),'Guide marker missing');
              }
            }
            report.resources.push(item);
          }
          report.gates.ALL_4_LINKS_PUBLIC_REACHABLE = 'PASS';
          report.gates.PDF_HASHES_MATCH_R5_VISUAL_QA = 'PASS';

          const browser = await chromium.launch({headless:true});
          try {
            for(const vp of viewports){
              const context = await browser.newContext({
                viewport:{width:vp.width,height:vp.height},
                hasTouch:vp.width <= 390,
                isMobile:false,
                deviceScaleFactor:1
              });
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const unsafeWrites = [];

              page.on('pageerror',e => pageErrors.push(String(e?.message||e)));
              page.on('console',m => {
                if(m.type()==='error'){
                  const loc=m.location?.()||{};
                  consoleErrors.push({text:m.text(),url:loc.url||'',lineNumber:loc.lineNumber??null});
                }
              });
              page.on('request',req => {
                const method=req.method().toUpperCase();
                if(writeMethods.has(method)) unsafeWrites.push({method,url:req.url()});
              });

              const response = await page.goto(`${PRODUCT}?r6qa=${Date.now()}-${vp.width}`,{
                waitUntil:'networkidle', timeout:45000
              });
              assert(response?.ok(),`${vp.name} Product HTTP ${response?.status()}`);
              await page.locator('#tutorial-resources').waitFor({state:'visible',timeout:15000});

              const measured = await page.evaluate(({expected}) => {
                const q = s => document.querySelector(s);
                const links = [...document.querySelectorAll('[data-izakaya-tutorial-resource]')].map(a => {
                  const r=a.getBoundingClientRect();
                  return {
                    key:a.dataset.izakayaTutorialResource,
                    href:a.href,
                    text:(a.textContent||'').trim(),
                    rect:{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height},
                    visible:!!(r.width && r.height)
                  };
                });
                const section=q('#tutorial-resources');
                const price=q('#price');
                const live=q('#live');
                const line=[...document.querySelectorAll('a')].find(a => (a.textContent||'').includes('LINE相談') || (a.textContent||'').includes('LINEで相談する'));
                const demo=[...document.querySelectorAll('a')].find(a => (a.textContent||'').includes('別タブで開く') && a.href.includes('izakaya-liff-demo.pages.dev'));
                const inner=window.innerWidth;
                const doc=document.documentElement.scrollWidth;
                const body=document.body.scrollWidth;
                return {
                  innerWidth:inner,
                  documentElementScrollWidth:doc,
                  bodyScrollWidth:body,
                  positiveOverflow:Math.max(0,doc-inner,body-inner),
                  masterSections:document.querySelectorAll('[data-master-section]').length,
                  resourceCount:links.length,
                  links,
                  resourceSectionVisible:!!section && !!section.getBoundingClientRect().height,
                  priceText:price?.textContent||'',
                  livePresent:!!live,
                  lineHref:line?.href||'',
                  demoHref:demo?.href||'',
                  title:document.title
                };
              }, {expected:resources.map(x=>x.url)});

              assert(measured.innerWidth===vp.width,`${vp.name} innerWidth ${measured.innerWidth}`);
              assert(measured.positiveOverflow===0,`${vp.name} overflow ${JSON.stringify(measured)}`);
              assert(measured.masterSections===12,`${vp.name} master sections ${measured.masterSections}`);
              assert(measured.resourceCount===4,`${vp.name} resource count ${measured.resourceCount}`);
              assert(measured.resourceSectionVisible,`${vp.name} resource section hidden`);
              assert(measured.priceText.includes('月額合計 5,500円（税込）'),`${vp.name} price regression`);
              assert(measured.livePresent,`${vp.name} LIVE section missing`);
              assert(measured.lineHref.startsWith('https://lin.ee/'),`${vp.name} LINE CTA missing`);
              assert(measured.demoHref==='https://izakaya-liff-demo.pages.dev/',`${vp.name} LIVE DEMO link regression`);

              for(const x of resources){
                const l=measured.links.find(v=>v.key===x.key);
                assert(l,`${vp.name} missing ${x.key}`);
                assert(l.href===x.url,`${vp.name} ${x.key} href ${l.href}`);
                assert(l.visible,`${vp.name} ${x.key} not visible`);
                assert(l.rect.left >= -1 && l.rect.right <= measured.innerWidth + 1,
                  `${vp.name} ${x.key} outside viewport ${JSON.stringify(l.rect)}`);
              }

              // Focus-visible regression check on an R6 resource.
              const focus = await page.evaluate(() => {
                const el=document.querySelector('[data-izakaya-tutorial-resource="tutorial-start"]');
                el.focus();
                const s=getComputedStyle(el);
                return {outlineStyle:s.outlineStyle, outlineWidth:s.outlineWidth};
              });
              assert(focus.outlineStyle!=='none' && parseFloat(focus.outlineWidth)>0,`${vp.name} focus not visible`);

              assert(pageErrors.length===0,`${vp.name} pageerrors ${pageErrors.join(' | ')}`);
              assert(consoleErrors.length===0,`${vp.name} console errors ${JSON.stringify(consoleErrors)}`);
              assert(unsafeWrites.length===0,`${vp.name} unsafe writes ${JSON.stringify(unsafeWrites)}`);

              await page.screenshot({
                path:`r6-qa/screenshots/product-${vp.name}.png`,
                fullPage:true
              });

              report.viewports.push({
                ...vp,
                ...measured,
                focus,
                pageErrors,
                consoleErrors,
                unsafeWrites,
                pass:true
              });
              report.totals.pageErrors += pageErrors.length;
              report.totals.consoleErrors += consoleErrors.length;
              report.totals.unsafeWrites += unsafeWrites.length;
              await context.close();
            }
          } finally {
            await browser.close();
            await api.dispose();
          }

          report.gates.EXACT_4_VIEWPORTS = 'PASS';
          report.gates.RESPONSIVE_OVERFLOW_0 = 'PASS';
          report.gates.R6_RESOURCE_LINKS_EXACT = 'PASS';
          report.gates.EXISTING_LIVE_DEMO = 'PASS';
          report.gates.EXISTING_PRICE = 'PASS';
          report.gates.EXISTING_LINE_CTA = 'PASS';
          report.gates.KEYBOARD_FOCUS_VISIBLE = 'PASS';
          report.gates.PAGEERROR_0 = 'PASS';
          report.gates.CONSOLE_ERROR_0 = 'PASS';
          report.gates.UNSAFE_WRITE_REQUEST_0 = 'PASS';
          report.gates.BUSINESS_MUTATION_0 = 'PASS';
          report.gates.PRODUCT_SITE_REGRESSION = 'PASS';
          report.gates.R7 = 'NOT_AUTHORIZED_NOT_EXECUTED';
          report.R6 = 'FULL_PASS';

          fs.writeFileSync('r6-qa/R6_LIVE_QA_EVIDENCE.json',JSON.stringify(report,null,2));
          fs.writeFileSync('r6-qa/R6_STATUS.txt',[
            'SYSTEM=IZAKAYA',
            'R6=FULL_PASS',
            `PRODUCT_URL=${PRODUCT}`,
            `PRODUCT_MAIN_BLOB=${report.productMainBlob}`,
            'VIEWPORTS=1440x1000,1024x768,390x844,320x720',
            'OVERFLOW=0',
            'RESOURCE_LINKS=4/4 PASS',
            'PAGEERROR=0',
            'CONSOLE_ERROR=0',
            'UNSAFE_WRITE_REQUEST=0',
            'BUSINESS_MUTATION=0',
            'R7=NOT_AUTHORIZED_NOT_EXECUTED'
          ].join('\n')+'\n');
          console.log(JSON.stringify({
            R6:report.R6,
            productMainBlob:report.productMainBlob,
            viewports:report.viewports.map(v=>({
              name:v.name,
              innerWidth:v.innerWidth,
              documentElementScrollWidth:v.documentElementScrollWidth,
              bodyScrollWidth:v.bodyScrollWidth,
              positiveOverflow:v.positiveOverflow
            })),
            resources:report.resources,
            totals:report.totals
          },null,2));
          JS
          node r6-qa/r6-live-qa.mjs

      - name: Upload R6 LIVE QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_IZAKAYA_R6_PRODUCT_SITE_LIVE_QA
          path: r6-qa
          if-no-files-found: error
