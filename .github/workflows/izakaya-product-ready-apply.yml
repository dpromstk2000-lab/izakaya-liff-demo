name: IZAKAYA Product READY Apply + Live Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakaya-product-ready-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izakaya-product-ready-14
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard source HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          if [ "$CURRENT" != "$REMOTE" ]; then
            echo "main advanced after workflow started; refusing to overwrite."
            exit 1
          fi

      - name: Apply #14 IZAKAYA Product READY Priority A only
        shell: python
        env:
          B64_RELEASE: ""
          B64_SHARED: ""
          B64_MIDDLEWARE: ""
          B64_HEALTH: ""
          B64_SYSTEM_CHECK: ""
        run: |
          from pathlib import Path
          import os, base64
          payloads = {
            "dpro-release.json": os.environ["B64_RELEASE"],
            "functions/_shared/dpro-ready.js": os.environ["B64_SHARED"],
            "functions/_middleware.js": os.environ["B64_MIDDLEWARE"],
            "functions/api/health.js": os.environ["B64_HEALTH"],
            "functions/api/system-check.js": os.environ["B64_SYSTEM_CHECK"],
          }
          for rel, encoded in payloads.items():
            p = Path(rel)
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_bytes(base64.b64decode(encoded))
          print("Applied files:")
          for rel in payloads: print(rel)

      - name: Source syntax QA
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_shared/dpro-ready.js
          node --check functions/_middleware.js
          node --check functions/api/health.js
          node --check functions/api/system-check.js
          python -m json.tool dpro-release.json >/dev/null

      - name: Commit source patch
        id: source_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dpro-release.json functions/_shared/dpro-ready.js functions/_middleware.js functions/api/health.js functions/api/system-check.js
          if git diff --cached --quiet; then
            echo "No source changes required."
          else
            git commit -m "DPRO Product READY #14 IZAKAYA Priority A"
            git push origin HEAD:main
          fi
          SOURCE_HEAD="$(git rev-parse HEAD)"
          echo "source_head=$SOURCE_HEAD" >> "$GITHUB_OUTPUT"
          echo "SOURCE_HEAD=$SOURCE_HEAD" >> "$GITHUB_ENV"

      - name: Wait for Cloudflare Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="IZAKAYA-PR1-20260823"
          URL="https://izakaya-liff-demo.pages.dev/api/system-check"
          for i in $(seq 1 72); do
            code="$(curl -sS -o /tmp/system-check.json -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] && grep -q "\"workerVersion\": \"$EXPECTED\"" /tmp/system-check.json; then
              cat /tmp/system-check.json
              exit 0
            fi
            echo "waiting for Pages deploy: attempt=$i http=$code"
            sleep 10
          done
          cat /tmp/system-check.json || true
          exit 1

      - name: Runtime contract QA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://izakaya-liff-demo.pages.dev/api/health > /tmp/health.json
          curl -fsS https://izakaya-liff-demo.pages.dev/api/system-check > /tmp/system-check.json
          curl -fsS https://izakaya-liff-demo.pages.dev/dpro-release.json > /tmp/release.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          c=json.load(open('/tmp/system-check.json'))
          r=json.load(open('/tmp/release.json'))
          assert h.get('ok') is True, h
          assert c.get('ok') is True, c
          assert c.get('systemCode') == 'IZAKAYA', c
          assert c.get('blockingFailCount') == 0, c
          assert c.get('productionGuard') is True, c
          assert c.get('dbOk') is True, c
          assert c.get('versionsAligned') is True, c
          assert c.get('workerVersion') == 'IZAKAYA-PR1-20260823', c
          assert c.get('databaseVersion') == 'IZAKAYA-DB-PR1-20260823', c
          assert c.get('frontendVersion') == 'IZAKAYA-PR1-20260823', c
          assert r.get('workerVersion') == c.get('workerVersion'), (r,c)
          assert r.get('databaseVersion') == c.get('databaseVersion'), (r,c)
          assert r.get('frontendVersion') == c.get('frontendVersion'), (r,c)
          print('Runtime contract PASS')
          PY

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser QA PC / 390 / 320 / iPad / DEMO guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://izakaya-liff-demo.pages.dev';
          const targets = [
            {name:'pc-admin', path:'/admin.html?embed_demo=1', width:1440, height:1000},
            {name:'mobile390-customer', path:'/index.html?embed_demo=1', width:390, height:844},
            {name:'mobile320-customer', path:'/index.html?embed_demo=1', width:320, height:720},
            {name:'ipad-owner', path:'/owner-ipad.html?embed_demo=1', width:1024, height:1366},
          ];
          (async () => {
            const browser = await chromium.launch();
            const results = [];
            for (const t of targets) {
              const page = await browser.newPage({viewport:{width:t.width,height:t.height}});
              const response = await page.goto(base+t.path,{waitUntil:'networkidle',timeout:60000});
              if (!response || !response.ok()) throw new Error(`${t.name} HTTP ${response?.status()}`);
              await page.waitForTimeout(1000);
              const m = await page.evaluate(() => ({
                title: document.title,
                bodyWidth: document.body.scrollWidth,
                viewportWidth: document.documentElement.clientWidth,
                productIdentity: /居酒屋DPRO|DPRO 居酒屋/.test(document.body.innerText)
              }));
              if (m.bodyWidth > m.viewportWidth + 2) throw new Error(`${t.name} horizontal overflow ${m.bodyWidth}>${m.viewportWidth}`);
              if (!m.productIdentity) throw new Error(`${t.name} product identity missing`);
              await page.screenshot({path:`/tmp/${t.name}.png`,fullPage:true});
              results.push({...t,...m,ok:true});
              await page.close();
            }
            const page = await browser.newPage({viewport:{width:1024,height:768}});
            await page.goto(base+'/owner-ipad.html?embed_demo=1',{waitUntil:'networkidle',timeout:60000});
            const mutation = await page.evaluate(async () => {
              const r = await fetch('/api/admin/shop-status',{
                method:'POST',
                headers:{'Content-Type':'application/json','X-Admin-Token':'1234'},
                body:JSON.stringify({status:'open',message:'QA'})
              });
              return {status:r.status, body:await r.text()};
            });
            if (mutation.status !== 403) throw new Error(`DEMO mutation was not blocked: ${mutation.status}`);
            results.push({name:'demo-mutation-guard',ok:true,status:mutation.status});
            fs.writeFileSync('/tmp/browser-qa.json', JSON.stringify(results,null,2));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Public URL QA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/izakaya.html > /tmp/product.html
          grep -q '居酒屋' /tmp/product.html
          curl -fsSL --max-time 30 https://dpro-shop.com/systems/izakaya > /tmp/official.html
          grep -q '居酒屋' /tmp/official.html

      - name: Commit live QA evidence and remove bridge
        shell: python
        run: |
          from pathlib import Path
          import json, os, datetime
          health=json.load(open('/tmp/health.json'))
          check=json.load(open('/tmp/system-check.json'))
          browser=json.load(open('/tmp/browser-qa.json'))
          evidence={
            "systemCode":"IZAKAYA",
            "scope":"#14 only",
            "sourceHead":os.environ["SOURCE_HEAD"],
            "workerVersion":check["workerVersion"],
            "databaseVersion":check["databaseVersion"],
            "frontendVersion":check["frontendVersion"],
            "systemCheckOk":check["ok"],
            "blockingFailCount":check["blockingFailCount"],
            "productionGuard":check["productionGuard"],
            "dbOk":check["dbOk"],
            "versionsAligned":check["versionsAligned"],
            "browserQA":browser,
            "publicURLs":{
              "demo":"https://izakaya-liff-demo.pages.dev/owner-ipad.html?embed_demo=1",
              "product":"https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/izakaya.html",
              "official":"https://dpro-shop.com/systems/izakaya"
            },
            "checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "standardChanged":False
          }
          Path("PRODUCT_READY_LIVE_QA.json").write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path(".github/workflows/izakaya-product-ready-apply.yml").unlink(missing_ok=True)

      - name: Finalize clean HEAD
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          rm -rf node_modules
          git add PRODUCT_READY_LIVE_QA.json
          git add -u .github/workflows/izakaya-product-ready-apply.yml
          git commit -m "DPRO Product READY #14 IZAKAYA live QA PASS"
          git push origin HEAD:main
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
