name: STEP DPRO-SYSTEMS-12 Izakaya Operation Demo R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-12-izakaya-operation-demo-r2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and clarify izakaya public operation demo
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          official_url = "https://dpro-shop.com/systems/izakaya"
          portal = base64.b64decode("").decode("utf-8")
          banner = base64.b64decode("").decode("utf-8")
          shared_css = base64.b64decode("").decode("utf-8")
          css_marker = "/* DPRO-SYSTEMS-12 IZAKAYA OPERATION DEMO */"

          screen_files = ["index.html", "admin.html", "owner-ipad.html"]
          body_classes = {
              "index.html": "izakaya-operation-customer",
              "admin.html": "izakaya-operation-owner",
              "owner-ipad.html": "izakaya-operation-ipad",
          }
          titles = {
              "index.html": "居酒屋DPRO 予約｜公開操作デモ",
              "admin.html": "居酒屋DPRO 管理画面｜公開操作デモ",
              "owner-ipad.html": "居酒屋DPRO iPad営業ボード｜公開操作デモ",
          }

          for filename in screen_files:
              if not Path(filename).exists():
                  raise SystemExit(f"ERROR: required public screen not found: {filename}")

          original_contents = {
              filename: Path(filename).read_text(encoding="utf-8")
              for filename in screen_files
          }

          for filename, content in original_contents.items():
              assert 'const IS_EMBED_DEMO = PAGE_PARAMS.get("embed_demo") === "1";' in content, filename

          # 管理PC・iPadは全更新処理を一括停止
          for filename in ["admin.html", "owner-ipad.html"]:
              content = original_contents[filename]
              assert 'if (IS_EMBED_DEMO && method !== "GET")' in content, filename

          # お客様画面は予約送信・取消・変更を各処理の先頭で停止
          customer = original_contents["index.html"]
          assert "async function submitReservationConfirmed()" in customer
          assert "async function cancelReservation(reservationId)" in customer
          assert "async function submitChangeReservation()" in customer
          assert customer.count("if (IS_EMBED_DEMO)") >= 4
          assert "予約リクエストは送信されません" in customer
          assert "予約キャンセルは実行されません" in customer
          assert "予約変更は実行されません" in customer

          Path("demo-guide.html").write_text(portal, encoding="utf-8")

          def set_title(text, filename):
              match = re.search(r"<title>.*?</title>", text, flags=re.I | re.S)
              if not match:
                  raise SystemExit(f"ERROR: title tag not found: {filename}")
              return text[:match.start()] + f"<title>{titles[filename]}</title>" + text[match.end():]

          def add_demo_meta(text, filename):
              if 'name="robots" content="noindex,nofollow,noarchive"' not in text:
                  head_close = re.search(r"</head>", text, flags=re.I)
                  if not head_close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  meta = '\n<meta name="robots" content="noindex,nofollow,noarchive">' + f'\n<link rel="canonical" href="{official_url}">\n'
                  text = text[:head_close.start()] + meta + text[head_close.start():]
              elif f'<link rel="canonical" href="{official_url}">' not in text:
                  head_close = re.search(r"</head>", text, flags=re.I)
                  if not head_close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  text = text[:head_close.start()] + f'\n<link rel="canonical" href="{official_url}">\n' + text[head_close.start():]
              return text

          def add_body_classes(text, filename):
              match = re.search(r"<body([^>]*)>", text, flags=re.I)
              if not match:
                  raise SystemExit(f"ERROR: body tag not found: {filename}")
              required = ["izakaya-operation-demo-page", body_classes[filename]]
              attrs = match.group(1)
              class_match = re.search(r'class="([^"]*)"', attrs)
              if class_match:
                  classes = class_match.group(1).split()
                  for name in required:
                      if name not in classes:
                          classes.append(name)
                  updated_attrs = attrs[:class_match.start()] + 'class="' + " ".join(classes) + '"' + attrs[class_match.end():]
              else:
                  updated_attrs = attrs + ' class="' + " ".join(required) + '"'
              return text[:match.start()] + "<body" + updated_attrs + ">" + text[match.end():]

          def add_css(text, filename):
              if css_marker in text:
                  return text
              close = re.search(r"</style>", text, flags=re.I)
              if not close:
                  raise SystemExit(f"ERROR: style closing tag not found: {filename}")
              return text[:close.start()] + "\n" + shared_css.strip() + "\n" + text[close.start():]

          def replace_demo_banner(text, filename):
              pattern = re.compile(r'<div\s+id=["\']embed-demo-banner["\'][^>]*>.*?</div>', flags=re.I | re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"ERROR: existing safe demo banner not found: {filename}")
              return text[:match.start()] + banner + text[match.end():]

          def preserve_demo_between_screens(text, filename):
              if filename == "admin.html":
                  old = 'ipadUrl.searchParams.set("pc", currentUrl.toString());'
                  new = 'ipadUrl.searchParams.set("pc", currentUrl.toString());\n      if (IS_EMBED_DEMO) ipadUrl.searchParams.set("embed_demo", "1");'
                  if new not in text:
                      if old not in text:
                          raise SystemExit("ERROR: admin to iPad navigation target not found")
                      text = text.replace(old, new, 1)

              if filename == "owner-ipad.html":
                  old = 'return localStorage.getItem(PC_RETURN_URL_KEY) || new URL("admin.html", location.href).toString();'
                  new = (
                      'const saved = localStorage.getItem(PC_RETURN_URL_KEY);\n'
                      '      if (saved) return saved;\n'
                      '      const adminUrl = new URL("admin.html", location.href);\n'
                      '      if (IS_EMBED_DEMO) adminUrl.searchParams.set("embed_demo", "1");\n'
                      '      return adminUrl.toString();'
                  )
                  if new not in text:
                      if old not in text:
                          raise SystemExit("ERROR: iPad to admin navigation target not found")
                      text = text.replace(old, new, 1)
              return text

          for filename in screen_files:
              text = original_contents[filename]
              text = set_title(text, filename)
              text = add_demo_meta(text, filename)
              text = add_body_classes(text, filename)
              text = add_css(text, filename)
              text = replace_demo_banner(text, filename)
              text = preserve_demo_between_screens(text, filename)
              Path(filename).write_text(text, encoding="utf-8")

          guide = Path("demo-guide.html").read_text(encoding="utf-8")
          assert "公開操作デモ・画面一覧" in guide
          assert guide.count('class="card"') == 3
          assert "index.html?embed_demo=1" in guide
          assert "admin.html?embed_demo=1" in guide
          assert "owner-ipad.html?embed_demo=1" in guide
          assert "モバイルオーダー・店内注文" in guide
          assert "POS・会計・決済" in guide

          for filename in screen_files:
              content = Path(filename).read_text(encoding="utf-8")
              assert titles[filename] in content, filename
              assert 'name="robots" content="noindex,nofollow,noarchive"' in content, filename
              assert f'<link rel="canonical" href="{official_url}">' in content, filename
              assert "izakaya-operation-demo-page" in content, filename
              assert body_classes[filename] in content, filename
              assert 'id="embed-demo-banner" class="izakaya-operation-demo-banner"' in content, filename
              assert css_marker in content, filename
              assert "demo-guide.html" in content, filename
              assert official_url in content, filename
              assert 'const IS_EMBED_DEMO = PAGE_PARAMS.get("embed_demo") === "1";' in content, filename

          customer = Path("index.html").read_text(encoding="utf-8")
          assert customer.count("if (IS_EMBED_DEMO)") >= 4
          assert "予約リクエストは送信されません" in customer
          assert "予約キャンセルは実行されません" in customer
          assert "予約変更は実行されません" in customer

          admin = Path("admin.html").read_text(encoding="utf-8")
          ipad = Path("owner-ipad.html").read_text(encoding="utf-8")
          assert 'if (IS_EMBED_DEMO && method !== "GET")' in admin
          assert 'if (IS_EMBED_DEMO && method !== "GET")' in ipad
          assert 'ipadUrl.searchParams.set("embed_demo", "1")' in admin
          assert 'adminUrl.searchParams.set("embed_demo", "1")' in ipad
          assert "営業前DEMO準備" in admin
          assert "営業前DEMO準備" in ipad
          assert "#btn-demo-reset" in admin
          assert "#btn-demo-reset" in ipad
          assert "display:none!important" in admin
          assert "display:none!important" in ipad

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo-guide.html index.html admin.html owner-ipad.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-12 clarify izakaya operation demo R2"
          git push
